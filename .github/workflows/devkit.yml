name: Agents DevKits validation

on:
  pull_request:
    paths:
      - "devkit/**"
      - "devkit.sh"
      - ".github/workflows/devkit.yml"
  push:
    branches:
      - main
    paths:
      - "devkit/**"
      - "devkit.sh"
      - ".github/workflows/devkit.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./devkit/scripts/test.sh
